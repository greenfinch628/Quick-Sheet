name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.9'
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/windows-requirements.txt
      - name: Install build dependencies
        run: python -m pip install -r packaging/windows-requirements.txt
      - name: Run application tests
        run: python -m unittest
      - name: Package Quick-Sheet
        id: package
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Quick-Sheet-Setup-${{ steps.package.outputs.version }}
          path: windows-build/release/Quick-Sheet-Setup-${{ steps.package.outputs.version }}.exe*
          if-no-files-found: error
